services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-api:
    build:
      context: .
      dockerfile: app/storage_api/Dockerfile
    env_file:
      - .env
    ports:
      - "${STORAGE_API_HOST_PORT:-8000}:8000"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./app/storage_api:/app/app/storage_api
      - ./src:/app/src

volumes:
  minio-data:
